[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termuxpilot"
version = "0.1.0"
description = "CLI-first autonomous AI agent for Termux on Android (OpenAI-compatible providers)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Surekey78" }]
keywords = ["termux", "android", "ai", "agent", "cli", "openai-compatible"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tp = "termuxpilot.cli:main"

[project.urls]
Homepage = "https://github.com/Surekey78/TermuxPilot"
Repository = "https://github.com/Surekey78/TermuxPilot"

[tool.hatch.build.targets.wheel]
packages = ["src/termuxpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
